<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driftwood — Component Gallery</title>

  <!-- Apply saved/system theme before first paint (prevents a light flash in dark mode) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('course-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Google Fonts: Bricolage Grotesque · Geist · JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <!--
    CUSTOMIZE PER COURSE — replace #D94F30 with ONE hex value.
    Every other accent shade (hover, light tint, ring) is derived from it
    automatically, in both light and dark mode.
      vermillion  #D94F30  (default — warm, energetic)
      coral       #E06B56
      teal        #1F7A8C  (calm, technical tools)
      amber       #C98A1B  (creative tools)
      forest      #2D8B55  (data / productivity)
      indigo      #4F5BD5  (developer libraries — use sparingly, no gradients)
      rose        #C2577E
  -->
  <style>
    :root { --color-accent: #D94F30; }
  </style>

  <script src="main.js" defer></script>
</head>
<body class="has-sidebar">

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <button class="icon-btn toc-toggle" id="toc-toggle" aria-label="Open table of contents" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <span class="topbar-title">Driftwood — Component Gallery</span>
      <span class="topbar-module" id="topbar-module"></span>
      <div class="topbar-actions">
        <span class="topbar-progress" id="topbar-progress">0%</span>
        <div class="platform-switch" id="platform-switch" role="group" aria-label="Keyboard shortcuts for" hidden>
          <button type="button" data-platform="mac" aria-pressed="false">macOS</button>
          <button type="button" data-platform="win" aria-pressed="false">Windows</button>
          <button type="button" data-platform="linux" aria-pressed="false">Linux</button>
        </div>
        <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="Course progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
  </header>

  <!-- Table of contents: main.js builds the list from every .module's .module-title -->
  <nav class="sidebar" id="sidebar" aria-label="Course modules">
    <div class="sidebar-label">Modules</div>
    <ol class="toc" id="toc"></ol>
    <div class="sidebar-footer">
      Press <kbd>N</kbd> / <kbd>P</kbd> for next / previous module.
    </div>
  </nav>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>

  <main id="main">
    <!-- modules/*.html content is assembled here by build.sh -->
